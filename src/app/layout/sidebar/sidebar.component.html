<!-- Sidebar unique -->
<aside
  class="sigr-sidebar flex flex-col shadow-sm border-r border-gray-200 z-30 transition-all duration-300 flex-shrink-0"
  [ngClass]="getSidebarClasses()"
  style="background: var(--sigr-50);"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">

  <!-- Logo -->
  <div class="px-6 pt-7 pb-5 border-b border-gray-100 flex flex-col items-center">
    <p class="text-2xl font-extrabold text-center tracking-tight transition-all duration-300 whitespace-nowrap"
       style="color: var(--sigr-900);">
      SIGR
    </p>
    <p class="text-[11px] font-medium text-gray-400 mt-1 text-center tracking-wide"
       *ngIf="showLabels">
      GESTION DES RISQUES
    </p>
  </div>

  <!-- Menu -->
  <nav class="flex-1 px-3 py-5 overflow-y-auto sigr-scroll" role="navigation" aria-label="Menu principal">
    <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-3 px-3"
       *ngIf="showLabels">
      Menu principal
    </p>

    <ul class="space-y-0.5">
      <li *ngFor="let item of menuItems">

        <!-- MENU AVEC ENFANTS -->
        <div *ngIf="item.children">
          <button
            type="button"
            (click)="onMenuItemClick(item)"
            [attr.aria-expanded]="item.expanded"
            [attr.title]="!showLabels ? item.label : null"
            [disabled]="!isMenuItemEnabled(item)"
            [ngClass]="isMenuItemEnabled(item)
              ? 'text-gray-600 hover:bg-[var(--sigr-100)] hover:text-[var(--sigr-900)]'
              : 'text-gray-300 cursor-not-allowed'"
            class="sigr-item w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]">
            <div class="flex items-center gap-3 min-w-0">
              <i [class]="item.icon" class="w-5 text-center flex-shrink-0"></i>
              <span *ngIf="showLabels" class="truncate">{{ item.label }}</span>
            </div>
            <i *ngIf="showLabels"
               class="fas fa-chevron-down w-3.5 text-center text-gray-400 transition-transform duration-200 flex-shrink-0"
               [class.rotate-180]="item.expanded"></i>
          </button>

          <!-- SOUS-MENU -->
          <ul *ngIf="item.expanded && showLabels" class="ml-4 pl-3 mt-0.5 mb-1 space-y-0.5 border-l border-gray-100">
            <li *ngFor="let child of item.children">

              <!-- SOUS-MENU AVEC ENFANTS -->
              <div *ngIf="child.children">
                <button
                  type="button"
                  (click)="onMenuItemClick(child)"
                  [attr.aria-expanded]="child.expanded"
                  [disabled]="!isMenuItemEnabled(child)"
                  [ngClass]="isMenuItemEnabled(child)
                    ? 'text-gray-600 hover:bg-[var(--sigr-100)] hover:text-[var(--sigr-900)]'
                    : 'text-gray-300 cursor-not-allowed'"
                  class="w-full flex items-center justify-between gap-3 px-3 py-2 rounded-lg text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]">
                  <div class="flex items-center gap-3 min-w-0">
                    <i [class]="child.icon" class="w-4 text-center flex-shrink-0"></i>
                    <span class="truncate">{{ child.label }}</span>
                  </div>
                  <i class="fas fa-chevron-down w-3 text-center text-gray-400 transition-transform duration-200 flex-shrink-0"
                     [class.rotate-180]="child.expanded"></i>
                </button>

                <!-- SOUS-SOUS-MENU -->
                <ul *ngIf="child.expanded" class="ml-3 pl-3 mt-0.5 space-y-0.5 border-l border-gray-100">
                  <li *ngFor="let subChild of child.children">
                    <a *ngIf="subChild.path && isMenuItemEnabled(subChild)"
                       [routerLink]="subChild.path"
                       routerLinkActive="sigr-active"
                       [routerLinkActiveOptions]="{ exact: false }"
                       (click)="onMenuItemClick(subChild)"
                       class="sigr-item block w-full px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-[var(--sigr-100)] hover:text-[var(--sigr-900)] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]">
                      {{ subChild.label }}
                    </a>
                    <div *ngIf="!subChild.path || !isMenuItemEnabled(subChild)"
                         class="block w-full px-3 py-2 rounded-lg text-sm text-gray-300 cursor-not-allowed">
                      {{ subChild.label }}
                    </div>
                  </li>
                </ul>
              </div>

              <!-- SOUS-MENU SANS ENFANTS -->
              <a *ngIf="!child.children && child.path && isMenuItemEnabled(child)"
                 [routerLink]="child.path"
                 routerLinkActive="sigr-active"
                 [routerLinkActiveOptions]="{ exact: false }"
                 (click)="onMenuItemClick(child)"
                 class="sigr-item block w-full px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-[var(--sigr-100)] hover:text-[var(--sigr-900)] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]">
                {{ child.label }}
              </a>
              <div *ngIf="!child.children && (!child.path || !isMenuItemEnabled(child))"
                   class="block w-full px-3 py-2 rounded-lg text-sm text-gray-300 cursor-not-allowed">
                {{ child.label }}
              </div>
            </li>
          </ul>
        </div>

        <!-- MENU AVEC ROUTE -->
        <a *ngIf="!item.children && item.path && isMenuItemEnabled(item)"
           [routerLink]="item.path"
           routerLinkActive="sigr-active"
           [attr.aria-current]="'page'"
           [routerLinkActiveOptions]="{ exact: false }"
           (click)="onMenuItemClick(item)"
           [attr.title]="!showLabels ? item.label : null"
           class="sigr-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-600 hover:bg-[var(--sigr-100)] hover:text-[var(--sigr-900)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]">
          <i [class]="item.icon" class="w-5 text-center flex-shrink-0"></i>
          <span *ngIf="showLabels" class="truncate">{{ item.label }}</span>
        </a>

        <!-- MENU DÉSACTIVÉ -->
        <div *ngIf="!item.children && (!item.path || !isMenuItemEnabled(item))"
             [attr.title]="!showLabels ? item.label : null"
             class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 cursor-not-allowed">
          <i [class]="item.icon" class="w-5 text-center flex-shrink-0"></i>
          <span *ngIf="showLabels" class="truncate">{{ item.label }}</span>
        </div>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <button type="button"
          class="m-3 rounded-xl p-3 flex items-center gap-3 transition-all duration-300 hover:brightness-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60"
          style="background: var(--sigr-800);">
    <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
         style="background: var(--sigr-600);">
      AD
    </div>
    <div *ngIf="showLabels" class="min-w-0 text-left">
      <p class="text-white text-sm font-semibold truncate">Admin MEF</p>
      <p class="text-xs truncate" style="color: var(--sigr-200);">Administrateur</p>
    </div>
    <i *ngIf="showLabels" class="fas fa-chevron-right ml-auto text-xs flex-shrink-0" style="color: var(--sigr-200);"></i>
  </button>
</aside>

<!-- Bouton toggle mobile -->
<button *ngIf="!isLgScreen"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="isMobileMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
        class="fixed top-4 left-4 z-40 p-2.5 bg-white rounded-lg shadow-md border border-gray-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]">
  <i class="w-5 h-5" [class]="isMobileMenuOpen ? 'fas fa-times' : 'fas fa-bars'" style="color: var(--sigr-900);"></i>
</button>

<!-- Overlay mobile -->
<div *ngIf="isMobileMenuOpen && !isLgScreen"
     class="fixed inset-0 bg-black/40 z-20 backdrop-blur-[1px]"
     (click)="closeMobileMenu()"></div>

<style>
.sigr-sidebar {
  --sigr-900: #1a4731;
  --sigr-800: #1a5c38;
  --sigr-700: #22703f;
  --sigr-600: #2f8659;
  --sigr-200: #a8d4b8;
  --sigr-100: #eaf5ee;
  --sigr-50: #f3faf5;
}

.sigr-scroll::-webkit-scrollbar { width: 5px; }
.sigr-scroll::-webkit-scrollbar-thumb {
  background: #e2e8f0;
  border-radius: 999px;
}
.sigr-scroll::-webkit-scrollbar-track { background: transparent; }

/* Etat actif : fond teinté + barre latérale, plus lisible qu'un bloc plein */
.sigr-item.sigr-active {
  background: var(--sigr-100);
  color: var(--sigr-900);
  font-weight: 600;
  position: relative;
}
.sigr-item.sigr-active::before {
  content: "";
  position: absolute;
  left: -0.75rem;
  top: 0.35rem;
  bottom: 0.35rem;
  width: 3px;
  border-radius: 999px;
  background: var(--sigr-600);
}
</style>
