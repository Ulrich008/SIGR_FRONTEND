<!-- Top bar -->
<div class="sigr-header bg-white border-b border-gray-200 px-3 md:px-6 py-3 flex flex-col flex-shrink-0">
  <div class="flex items-center justify-between">

    <!-- Guide d'utilisation : ouvre le guide complet dans un nouvel onglet -->
    <a
      [href]="guideUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Consulter le guide d'utilisation de la plateforme"
      title="SIGR — Guide d'utilisation (En cours d'élaboration)"
      class="inline-flex items-center gap-2 rounded-lg border border-[var(--sigr-100)] bg-[var(--sigr-100)]/60 px-3 py-2 text-sm font-semibold text-[var(--sigr-900)] transition hover:bg-[var(--sigr-100)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
      </svg>
      <span class="hidden sm:inline">Guide d'utilisation</span>
    </a>

    <div class="flex items-center">
      <!-- Notification -->
      <button
        type="button"
        (click)="openNotifications()"
        aria-label="Notifications"
        class="relative p-2 text-gray-500 hover:text-gray-700 transition-colors rounded-full hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span
          *ngIf="notificationCount > 0"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center font-bold ring-2 ring-white">
          {{ notificationCount > 99 ? '99+' : notificationCount }}
        </span>
      </button>

      <!-- Déconnexion : icône seule sur mobile, texte + icône sur md+ -->
      <button
        type="button"
        (click)="confirmLogout()"
        aria-label="Déconnexion"
        class="ml-1 md:ml-2 inline-flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-2 py-2 md:px-4 md:py-2 text-sm font-semibold text-red-700 transition hover:bg-red-100 hover:border-red-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-300"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span class="hidden md:inline">Déconnexion</span>
      </button>

      <!-- Séparateur -->
      <div class="w-px h-6 bg-gray-200 mx-2 md:mx-3"></div>

      <!-- Ministère de l'agent connecté : bien visible, en gras -->
      <div *ngIf="sigleMinistere" class="hidden md:flex flex-col items-end mr-3 leading-tight">
        <span *ngIf="nomComplet" class="text-xs text-gray-500">{{ nomComplet }}</span>
        <span class="text-sm font-bold" style="color: var(--sigr-900);">{{ sigleMinistere }}</span>
      </div>

      <!-- Avatar : ouvre la page "Mon profil" (/me) -->
      <button type="button"
              (click)="ouvrirMonProfil()"
              class="flex items-center gap-1.5 rounded-full pr-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-700)] hover:bg-gray-50 transition-colors"
              [attr.aria-label]="nomComplet ? 'Voir mon profil (' + nomComplet + ')' : 'Voir mon profil'">
        <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ring-2 ring-[var(--sigr-100)] shadow-sm"
             style="background: linear-gradient(135deg, var(--sigr-600), var(--sigr-900));">
          <i class="fas fa-user text-white text-xs"></i>
        </div>
        <i class="fas fa-chevron-down hidden md:block text-[10px] text-gray-400"></i>
      </button>
    </div>
  </div>
</div>

<style>
.sigr-header {
  --sigr-900: #1a4731;
  --sigr-700: #22703f;
  --sigr-600: #2f8659;
  --sigr-100: #eaf5ee;
}
</style>
