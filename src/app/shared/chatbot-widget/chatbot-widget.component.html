<!-- Bulle flottante -->
<button
  type="button"
  (click)="toggle()"
  class="sigr-chat-fab"
  [class.sigr-chat-fab--open]="chatbot.isOpen"
  [attr.aria-label]="chatbot.isOpen ? 'Fermer l\'assistant SIGR' : 'Ouvrir l\'assistant SIGR'"
>
  <svg *ngIf="!chatbot.isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8-1.17 0-2.29-.2-3.32-.56L3 21l1.67-4.17C3.6 15.42 3 13.77 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
  </svg>
  <svg *ngIf="chatbot.isOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </svg>
</button>

<!-- Panneau de discussion -->
<div class="sigr-chat-panel" *ngIf="chatbot.isOpen">

  <div class="sigr-chat-header">
    <div class="sigr-chat-avatar">S</div>
    <div class="flex-1 min-w-0">
      <p class="sigr-chat-title">Assistant SIGR</p>
      <p class="sigr-chat-subtitle">Aide sur l'utilisation de la plateforme</p>
    </div>
    <button type="button" (click)="close()" aria-label="Fermer" class="sigr-chat-close">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="sigr-chat-body">
    <div *ngFor="let msg of chatbot.messages" class="sigr-chat-row" [class.sigr-chat-row--user]="msg.from === 'user'">

      <div *ngIf="msg.from === 'bot'" class="sigr-chat-avatar sigr-chat-avatar--sm">S</div>

      <div class="sigr-chat-bubble" [class.sigr-chat-bubble--user]="msg.from === 'user'">
        <span [innerHTML]="formatText(msg.text)"></span>
        <a *ngIf="msg.from === 'bot' && msg.anchor"
           [href]="guideLinkFor(msg.anchor)"
           target="_blank"
           rel="noopener noreferrer"
           class="sigr-chat-more">
          En savoir plus dans le guide →
        </a>
      </div>
    </div>
    <div #scrollAnchor></div>
  </div>

  <div class="sigr-chat-suggestions" *ngIf="chatbot.messages.length <= 1">
    <button *ngFor="let s of suggestions" type="button" class="sigr-chat-chip" (click)="send(s)">
      {{ s }}
    </button>
  </div>

  <form class="sigr-chat-input-row" (ngSubmit)="send()">
    <input
      type="text"
      [(ngModel)]="draft"
      name="chatDraft"
      placeholder="Posez votre question..."
      autocomplete="off"
      class="sigr-chat-input"
    />
    <button type="submit" class="sigr-chat-send" [disabled]="!draft.trim()" aria-label="Envoyer">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
      </svg>
    </button>
  </form>

  <div class="sigr-chat-footer">
    <a [href]="guideUrl" target="_blank" rel="noopener noreferrer">Ouvrir le guide complet ↗</a>
  </div>
</div>

<style>
.sigr-chat-fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 900;
  width: 56px;
  height: 56px;
  border-radius: 999px;
  background: #1a4731;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 30px rgba(26, 71, 49, 0.35);
  border: none;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}
.sigr-chat-fab:hover { transform: translateY(-2px); background: #22703f; }
.sigr-chat-fab--open { background: #22703f; }

.sigr-chat-panel {
  position: fixed;
  bottom: 92px;
  right: 24px;
  z-index: 900;
  width: min(380px, calc(100vw - 32px));
  height: min(560px, calc(100vh - 140px));
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #e4e9e6;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  animation: sigrChatIn .18s ease-out;
}
@keyframes sigrChatIn {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.sigr-chat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px;
  background: linear-gradient(135deg, #1a4731, #22703f);
  color: white;
  flex-shrink: 0;
}
.sigr-chat-avatar {
  width: 32px; height: 32px; border-radius: 999px;
  background: rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; flex-shrink: 0;
  font-family: Georgia, serif;
}
.sigr-chat-avatar--sm { width: 26px; height: 26px; background: #1a4731; color: white; margin-top: 2px; }
.sigr-chat-title { margin: 0; font-size: 13.5px; font-weight: 800; }
.sigr-chat-subtitle { margin: 0; font-size: 11px; color: #d8ecdf; }
.sigr-chat-close {
  background: rgba(255,255,255,0.12); border: none; color: white;
  width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.sigr-chat-close:hover { background: rgba(255,255,255,0.22); }

.sigr-chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #f8faf9;
}
.sigr-chat-row { display: flex; align-items: flex-start; gap: 8px; }
.sigr-chat-row--user { flex-direction: row-reverse; }

.sigr-chat-bubble {
  max-width: 80%;
  padding: 9px 12px;
  border-radius: 14px;
  background: white;
  border: 1px solid #e4e9e6;
  font-size: 13px;
  line-height: 1.5;
  color: #1c2521;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sigr-chat-bubble--user {
  background: #1a4731;
  color: white;
  border-color: #1a4731;
}
.sigr-chat-bubble strong { color: #14392a; }
.sigr-chat-bubble--user strong { color: white; }

.sigr-chat-more {
  font-size: 11.5px;
  font-weight: 700;
  color: #22703f;
  text-decoration: none;
  align-self: flex-start;
}
.sigr-chat-more:hover { text-decoration: underline; }

.sigr-chat-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 14px 12px;
  flex-shrink: 0;
}
.sigr-chat-chip {
  font-size: 11.5px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 999px;
  background: #eaf5ee;
  color: #1a4731;
  border: 1px solid #d3ebda;
  cursor: pointer;
  transition: background .15s;
}
.sigr-chat-chip:hover { background: #d3ebda; }

.sigr-chat-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid #e4e9e6;
  flex-shrink: 0;
}
.sigr-chat-input {
  flex: 1;
  border: 1px solid #e4e9e6;
  background: #f8faf9;
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 13px;
  outline: none;
}
.sigr-chat-input:focus { border-color: #22703f; background: white; }
.sigr-chat-send {
  width: 34px; height: 34px; border-radius: 999px;
  background: #1a4731; color: white; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: background .15s;
}
.sigr-chat-send:disabled { background: #b7c4bd; cursor: not-allowed; }
.sigr-chat-send:not(:disabled):hover { background: #22703f; }

.sigr-chat-footer {
  text-align: center;
  padding: 8px;
  border-top: 1px solid #e4e9e6;
  flex-shrink: 0;
}
.sigr-chat-footer a {
  font-size: 11px;
  color: #566661;
  text-decoration: none;
  font-weight: 600;
}
.sigr-chat-footer a:hover { color: #1a4731; text-decoration: underline; }

@media (max-width: 480px) {
  .sigr-chat-panel { right: 16px; bottom: 84px; }
  .sigr-chat-fab { right: 16px; bottom: 16px; }
}
</style>
