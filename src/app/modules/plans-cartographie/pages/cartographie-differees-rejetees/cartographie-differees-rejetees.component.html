<app-main-layout [menuItems]="menuItems" activeMenu="Cartographie des risques" searchPlaceholder="Rechercher..."
  organizationName="Ministère de l'Économie et des Finances" userInitials="AD">

  <div class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">

      <!-- En-tête -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <p class="text-sm text-gray-500">Gestion des risques</p>
          <h1 class="text-2xl font-semibold text-slate-900">Cartographie différée et rejetée</h1>
        </div>
      </div>

      <!-- Erreur globale -->
      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
        {{ error }}
      </div>

      <!-- Loader -->
      <div *ngIf="loading" class="rounded-3xl bg-white p-10 shadow-sm flex items-center justify-center">
        <span class="text-sm text-slate-500">Chargement des risques...</span>
      </div>

      <!-- Liste des risques -->
      <div *ngIf="!loading" class="rounded-3xl bg-white p-6 shadow-sm">
        <div *ngIf="risques.length === 0" class="text-center py-10 text-slate-500">
          Aucun risque différé ou rejeté pour le moment.
        </div>

        <div *ngIf="risques.length > 0" class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-slate-200">
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Code</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Libellé</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Processus</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Avis</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Motif</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <tr *ngFor="let risque of risques" class="hover:bg-slate-50 transition">
                <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-slate-900">
                  {{ risque.code }}
                </td>
                <td class="px-4 py-4 text-sm text-slate-700 max-w-xs truncate">
                  {{ risque.libelle }}
                </td>
                <td class="px-4 py-4 whitespace-nowrap text-sm text-slate-600">
                  {{ risque.nomProcessus }}
                </td>
                <td class="px-4 py-4 whitespace-nowrap">
                  <span
                    [class]="'inline-block rounded-full px-3 py-1 text-xs font-semibold ' + getAvisBadgeClass(risque.avis)">
                    {{ getAvisLabel(risque.avis) }}
                  </span>
                </td>
                <td class="px-4 py-4 text-sm text-slate-700 max-w-sm">
                  {{ risque.motif || '—' }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</app-main-layout>
