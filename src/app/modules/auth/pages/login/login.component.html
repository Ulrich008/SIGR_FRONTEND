<div class="min-h-screen w-full flex flex-col md:flex-row sigr-login">

  <!-- Panneau gauche : image de fond (50% de largeur) -->
  <div class="relative md:w-1/2 min-h-[20vh] md:min-h-screen flex flex-col items-center justify-center overflow-hidden">

    <div class="sigr-login-bg absolute inset-0"
         style="background-image: url('/assets/images/statut.jpg'); background-size: cover; background-position: center;">
    </div>

    <!-- Overlay léger pour améliorer la lisibilité du texte sans trop assombrir -->
    <div class="absolute inset-0 bg-black/20"></div>

    <!-- Dégradé bas léger -->
    <div class="absolute bottom-0 left-0 right-0 h-16"
         style="background: linear-gradient(to top, rgba(0,0,0,0.3), transparent);">
    </div>

    <!-- Texte au centre - minimal -->
    <div class="relative z-10 flex flex-col items-center justify-center text-center px-4">
      <p class="text-white/80 text-[8px] md:text-[10px] tracking-[2px] uppercase font-semibold"></p>
    </div>
  </div>

  <!-- Panneau droit : formulaire (50% de largeur) -->
  <div class="relative md:w-1/2 flex flex-col justify-center py-6 md:py-8 bg-white min-h-[80vh] md:min-h-screen">

    <!-- Contenu principal centré verticalement -->
    <div class="px-4 md:px-8 lg:px-12">
      <!-- Logo + titre -->
      <div class="sigr-fade-in-up flex flex-col items-center gap-2 mb-4" style="animation-delay: 0.05s;">
        <!-- Logo très grand -->
        <img src="/assets/images/mef.png"
             alt="Logo du Ministère de l'Économie et des Finances"
             class="w-40 h-40 md:w-52 md:h-52 lg:w-60 lg:h-60 object-contain">

        <div class="text-center">
          <h1 class="text-3xl md:text-4xl font-semibold" style="font-family: 'Georgia', serif; color: #003d20;">SIGR</h1>
          <p class="text-[10px] md:text-xs text-gray-500 tracking-wide">Système Intégré de Gestion des Risques</p>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="sigr-fade-in-up max-w-sm mx-auto w-full" style="animation-delay: 0.2s;">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-3">

          <!-- Matricule -->
          <div>
            <label for="matricule"
                   class="block text-xs font-semibold mb-1 tracking-wide"
                   style="color: #003d20;">
              Compte Utilisateur
            </label>
            <input
              type="text"
              id="matricule"
              formControlName="matricule"
              placeholder="Entrez votre matricule"
              class="w-full px-3.5 py-2 text-sm rounded-lg border border-gray-300 bg-white
                     focus:outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100
                     transition-colors placeholder-gray-400"
              [class.border-red-400]="loginForm.get('matricule')?.invalid && loginForm.get('matricule')?.touched"
              [class.bg-red-50]="loginForm.get('matricule')?.invalid && loginForm.get('matricule')?.touched"
            >
            <p class="text-red-500 text-xs mt-1"
               *ngIf="loginForm.get('matricule')?.invalid && loginForm.get('matricule')?.touched">
              {{ getErrorMessage('matricule') }}
            </p>
          </div>

          <!-- Mot de passe -->
          <div>
            <label for="password"
                   class="block text-xs font-semibold mb-1 tracking-wide"
                   style="color: #003d20;">
              Mot de passe
            </label>
            <div class="relative">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                formControlName="password"
                placeholder="Entrez votre mot de passe"
                class="w-full px-3.5 py-2 pr-10 text-sm rounded-lg border border-gray-300 bg-white
                       focus:outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100
                       transition-colors placeholder-gray-400"
                [class.border-red-400]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                [class.bg-red-50]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              >
              <button type="button" (click)="togglePasswordVisibility()"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <ng-container *ngIf="showPassword">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                  </ng-container>
                  <ng-container *ngIf="!showPassword">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </ng-container>
                </svg>
              </button>
            </div>
            <p class="text-red-500 text-xs mt-1"
               *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              {{ getErrorMessage('password') }}
            </p>
          </div>

          <!-- Liens supplémentaires -->
          <div class="flex justify-between items-center text-xs">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" formControlName="rememberMe" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
              <span class="text-gray-600">Se souvenir de moi</span>
            </label>
            <a routerLink="/auth/mot-de-passe-oublie" class="text-green-700 hover:text-green-800 hover:underline">Mot de passe oublié ?</a>
          </div>

          <!-- Erreur générale -->
          <div class="sigr-shake bg-red-50 border border-red-200 text-red-600 px-3 py-2 rounded-lg text-sm"
               *ngIf="error">
            {{ error }}
          </div>

          <!-- Bouton de connexion -->
          <button
            type="submit"
            class="sigr-btn w-full py-2 rounded-lg text-white text-sm font-semibold tracking-wide
                   transition-all duration-200 hover:opacity-90 hover:-translate-y-0.5 hover:shadow-lg active:scale-[0.99] active:translate-y-0
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:translate-y-0 disabled:shadow-none"
            style="background-color: #008751;"
            [disabled]="loading"
          >
            <span *ngIf="loading" class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                   fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10"
                        stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              Connexion en cours...
            </span>
            <span *ngIf="!loading">Se connecter</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Bande drapeau -->
    <div class="mt-auto px-4 md:px-8 lg:px-12 pt-4">
      <div class="flex h-0.5 rounded-full overflow-hidden mb-2">
        <div class="flex-1" style="background-color: #008751;"></div>
        <div class="flex-1" style="background-color: #fcd116;"></div>
        <div class="flex-1" style="background-color: #e8112d;"></div>
      </div>
      <p class="text-center text-gray-400 text-[8px] md:text-[10px]" style="letter-spacing: 0.5px;">
        © République du Bénin · Ministère des Finances
      </p>
    </div>
  </div>
</div>

<style>
/* Entrée nette (fondu + zoom arrière) puis zoom lent continu façon "Ken Burns" */
.sigr-login-bg {
  transform-origin: center;
  animation:
    sigrImageIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) both,
    sigrKenBurns 12s ease-in-out 1.2s infinite alternate;
}
@keyframes sigrImageIn {
  from { opacity: 0; transform: scale(1.25); }
  to   { opacity: 1; transform: scale(1.1); }
}
@keyframes sigrKenBurns {
  from { transform: scale(1.1); }
  to   { transform: scale(1.22); }
}

/* Entrée en fondu + léger glissement vers le haut, au chargement de la page */
.sigr-fade-in-up {
  opacity: 0;
  animation: sigrFadeInUp 0.6s ease-out forwards;
}
@keyframes sigrFadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Petite secousse pour attirer l'oeil sur le message d'erreur */
.sigr-shake {
  animation: sigrFadeInUp 0.3s ease-out, sigrShake 0.4s ease-in-out 0.3s;
}
@keyframes sigrShake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-4px); }
  40%      { transform: translateX(4px); }
  60%      { transform: translateX(-3px); }
  80%      { transform: translateX(3px); }
}

@media (prefers-reduced-motion: reduce) {
  .sigr-login-bg, .sigr-fade-in-up, .sigr-shake {
    animation: none !important;
    opacity: 1 !important;
  }
}
</style>
