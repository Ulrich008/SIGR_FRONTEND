<app-main-layout
  [menuItems]="menuItems"
  [activeMenu]="isEditMode ? 'Unités administratives' : 'Unités administratives'"
  searchPlaceholder="Rechercher..."
  organizationName="Ministère de l'Économie et des Finances"
  userInitials="AD">
  <div class="p-6">
    <div class="max-w-4xl mx-auto space-y-6">
      <app-page-header subtitle="Administration" [title]="isEditMode ? 'Modifier l\'unité administrative' : 'Nouvelle unité administrative'">
        <svg icon xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M6 21V7l6-4 6 4v14M9 9h1m-1 4h1m4-4h1m-1 4h1"/>
        </svg>
        <button
          actions
          (click)="cancel()"
          class="inline-flex items-center justify-center rounded-xl border border-white/30 bg-white/10 backdrop-blur-sm px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-white/20"
        >
          Retour
        </button>
      </app-page-header>

      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
        {{ error }}
      </div>

      <div class="rounded-3xl bg-white p-6 shadow-sm">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Informations générales -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-slate-900">Informations générales</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

              <!-- Sigle -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                  Sigle <span *ngIf="isRequired('code')" class="text-red-500">*</span>
                  <span class="text-xs font-normal text-gray-400 ml-1">(max 50 caractères)</span>
                </label>
                <input
                  formControlName="code"
                  type="text"
                  [class]="'w-full rounded-xl border px-4 py-3 text-sm focus:outline-none transition ' +
                    (isEditMode
                      ? 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'
                      : 'border-slate-200 bg-slate-50 focus:border-green-400')"
                  placeholder="DGB"
                />
                <p *ngIf="form.get('code')?.invalid && form.get('code')?.touched" class="mt-1 text-xs text-red-600">{{ getFieldError('code') }}</p>
              </div>

              <!-- Libellé -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                  Libellé <span *ngIf="isRequired('libelle')" class="text-red-500">*</span>
                  <span class="text-xs font-normal text-gray-400 ml-1">(max 200 caractères)</span>
                </label>
                <input
                  formControlName="libelle"
                  type="text"
                  class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none"
                  placeholder="Direction Générale du Budget"
                />
                <p *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched" class="mt-1 text-xs text-red-600">{{ getFieldError('libelle') }}</p>
              </div>

              <!-- Type d'unité -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                  Type d'unité <span *ngIf="isRequired('idTypeUnite')" class="text-red-500">*</span>
                </label>
                <app-searchable-select formControlName="idTypeUnite"
                  [options]="typeUniteOptions" placeholder="Rechercher un type d'unité..."></app-searchable-select>
                <p *ngIf="form.get('idTypeUnite')?.invalid && form.get('idTypeUnite')?.touched" class="mt-1 text-xs text-red-600">{{ getFieldError('idTypeUnite') }}</p>
              </div>

              <!-- Code ministère -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                  Ministère <span *ngIf="isRequired('codeMinistere')" class="text-red-500">*</span>
                </label>
                <app-searchable-select formControlName="codeMinistere"
                  [options]="ministereOptions" placeholder="Rechercher un ministère par nom..."></app-searchable-select>
                <p *ngIf="form.get('codeMinistere')?.invalid && form.get('codeMinistere')?.touched" class="mt-1 text-xs text-red-600">{{ getFieldError('codeMinistere') }}</p>
              </div>

              <!-- Unité parent -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Unité parent (optionnel)</label>
                <app-searchable-select formControlName="idUniteParent"
                  [options]="uniteParentOptions" placeholder="Rechercher une unité parent..."></app-searchable-select>
              </div>

              <!-- Niveau hiérarchique (calculé automatiquement) -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Niveau hiérarchique (calculé automatiquement)</label>
                <input
                  formControlName="niveauHierarchique"
                  type="number"
                  class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-sm text-slate-600 cursor-not-allowed"
                  placeholder="1"
                  readonly
                />
                <p class="mt-1 text-xs text-slate-500">Calculé automatiquement en fonction de l'unité parent</p>
              </div>

            </div>
          </div>

          <div class="flex justify-end gap-3 pt-4">
            <button
              type="button"
              (click)="cancel()"
              class="rounded-lg border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
            >
              Annuler
            </button>
            <button
              type="submit"
              [disabled]="loading"
              class="rounded-lg bg-emerald-700 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-600 disabled:opacity-50"
            >
              {{ loading ? 'Enregistrement...' : (isEditMode ? 'Modifier' : 'Créer') }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</app-main-layout>
