<app-main-layout
  [menuItems]="menuItems"
  activeMenu="Contrôle de second niveau"
  searchPlaceholder="Rechercher..."
  organizationName="Ministère de l'Économie et des Finances"
  userInitials="AD">

  <div class="p-4 md:p-6">
    <div class="max-w-[1600px] mx-auto space-y-6">

      <app-page-header subtitle="Contrôle Interne" title="Contrôle de second niveau">
        <svg icon xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <button
          actions
          (click)="nouveau()"
          [disabled]="!canWrite"
          [title]="!canWrite ? 'Vous n\'avez pas les droits pour créer un contrôle' : ''"
          [ngClass]="canWrite ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-white/10 text-slate-400 cursor-not-allowed'"
          class="inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2 text-sm font-semibold shadow-sm transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--sigr-100)]"
        >
          + Nouveau contrôle
        </button>
      </app-page-header>

      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">{{ error }}</div>

      <div *ngIf="loading" class="rounded-3xl bg-white p-10 shadow-sm flex items-center justify-center">
        <span class="text-sm text-slate-500">Chargement...</span>
      </div>

      <ng-container *ngIf="!loading">
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <input
            [(ngModel)]="searchTerm"
            (ngModelChange)="applyFilter()"
            type="text"
            placeholder="Rechercher par code, unité ou processus..."
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm focus:border-emerald-400 focus:outline-none" />
        </div>

        <div *ngIf="filteredControles.length === 0" class="rounded-3xl bg-white p-10 shadow-sm text-center text-sm text-slate-500">
          Aucun contrôle de second niveau trouvé.
        </div>

        <div *ngIf="filteredControles.length > 0" class="rounded-3xl bg-white p-6 shadow-sm">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 mb-6">
          <div *ngFor="let c of controles" class="rounded-3xl bg-white p-4 shadow-sm border-2 border-slate-200">
            <div class="flex items-start justify-between gap-3 mb-2">
              <span class="inline-block rounded-md bg-emerald-50 px-2 py-0.5 text-xs font-bold text-emerald-700">{{ c.code }}</span>
              <span class="text-xs text-slate-400">{{ formatDate(c.dateControle) }}</span>
            </div>
            <p class="text-sm font-semibold text-slate-900">{{ c.libelleUniteAdministrative }}</p>
            <p class="text-xs text-slate-400 truncate">{{ c.libelleProcessus }}</p>

            <div class="mt-4 flex gap-2 pt-4 border-t border-slate-100">
              <button (click)="voir(c.code)" title="Voir le détail" aria-label="Voir le détail" class="flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg bg-blue-100 px-3 py-2 text-xs font-semibold text-blue-700 transition hover:bg-blue-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                Voir le détail
              </button>
              <button *ngIf="canWrite" (click)="supprimer(c.code)" title="Supprimer" aria-label="Supprimer" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-red-100 px-3 py-2 text-xs font-semibold text-red-700 transition hover:bg-red-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                  <path d="M10 11v6M14 11v6"/>
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
                Supprimer
              </button>
            </div>
          </div>
        </div>

        <app-pagination
          [sticky]="true"
          [currentPage]="currentPage"
          (currentPageChange)="goToPage($event)"
          [totalItems]="filteredControles.length"
          [itemsPerPage]="itemsPerPage"
          (itemsPerPageChange)="onItemsPerPageChange($event)"
          itemLabel="contrôles"
        ></app-pagination>
        </div>
      </ng-container>

    </div>
  </div>

</app-main-layout>
