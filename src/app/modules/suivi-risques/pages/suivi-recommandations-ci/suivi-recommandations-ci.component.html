<app-main-layout
  [menuItems]="menuItems"
  activeMenu="Suivi des Recommandations des CI"
  searchPlaceholder="Rechercher..."
  organizationName="Ministère de l'Économie et des Finances"
  userInitials="AD">

  <div class="p-4 md:p-6">
    <div class="max-w-[1600px] mx-auto space-y-6">

      <app-page-header subtitle="Suivi des Risques" title="Suivi des Recommandations des CI">
        <svg icon xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </app-page-header>

      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">{{ error }}</div>

      <div *ngIf="loading" class="rounded-3xl bg-white p-10 shadow-sm flex items-center justify-center">
        <span class="text-sm text-slate-500">Chargement...</span>
      </div>

      <ng-container *ngIf="!loading">
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <input
            [(ngModel)]="searchTerm"
            (ngModelChange)="applyFilter()"
            type="text"
            placeholder="Rechercher par code, unité ou processus..."
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm focus:border-emerald-400 focus:outline-none" />
        </div>

        <div *ngIf="filteredRapports.length === 0" class="rounded-3xl bg-white p-10 shadow-sm text-center text-sm text-slate-500">
          Aucune recommandation de contrôle interne validée à suivre.
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
          <div *ngFor="let r of filteredRapports" (click)="voirDetail(r.code)"
            class="rounded-3xl bg-white p-5 shadow-sm cursor-pointer transition hover:shadow-md">
            <div class="flex items-start justify-between gap-3 mb-2">
              <span class="inline-block rounded-md bg-emerald-50 px-2 py-0.5 text-xs font-bold text-emerald-700">{{ r.code }}</span>
              <span [class]="'inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap ' + getStatutBadgeClass(r.statutSuivi)">
                {{ getStatutLabel(r.statutSuivi) }}
              </span>
            </div>
            <p class="text-sm font-semibold text-slate-900">{{ r.libelleUniteAdministrative }}</p>
            <p class="text-xs text-slate-400 truncate">{{ r.libelleProcessus }}</p>
            <p class="mt-2 text-xs text-slate-400">Émis le {{ formatDate(r.dateEmission) }}</p>

            <div class="mt-4 pt-4 border-t border-slate-100">
              <span class="text-xs font-semibold text-emerald-700">Voir le détail →</span>
            </div>
          </div>
        </div>
      </ng-container>

    </div>
  </div>

</app-main-layout>
