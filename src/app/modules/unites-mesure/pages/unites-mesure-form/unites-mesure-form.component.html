<app-main-layout
  [menuItems]="menuItems"
  activeMenu="Unités de mesure"
  searchPlaceholder="Rechercher..."
  organizationName="Ministère de l'Économie et des Finances"
  userInitials="AD">
  <div class="p-6">
    <div class="max-w-4xl mx-auto space-y-6">

      <!-- En-tête -->
      <app-page-header subtitle="Gestion des unités de mesure" [title]="isEditMode ? 'Modifier l\'unité de mesure' : 'Nouvelle unité de mesure'">
        <svg icon xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0z"/>
          <path d="M14.5 4.5l3 3M12 7l2 2M9.5 9.5l2 2M7 12l2 2"/>
        </svg>
        <button
          actions
          (click)="cancel()"
          class="inline-flex items-center justify-center rounded-xl border border-white/30 bg-white/10 backdrop-blur-sm px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-white/20"
        >
          Retour
        </button>
      </app-page-header>

      <!-- Erreur globale -->
      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
        {{ error }}
      </div>

      <!-- Loader -->
      <div *ngIf="loading" class="rounded-3xl bg-white p-10 shadow-sm flex items-center justify-center">
        <span class="text-sm text-slate-500">Chargement des données...</span>
      </div>

      <!-- Formulaire -->
      <div *ngIf="!loading" class="rounded-3xl bg-white p-6 shadow-sm">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

          <!-- Code -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Code <span *ngIf="isRequired('code')" class="text-red-500">*</span>
            </label>
            <input
              formControlName="code"
              type="text"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none"
              placeholder="Code de l'unité de mesure"
            />
            <p *ngIf="form.get('code')?.invalid && form.get('code')?.touched"
               class="mt-1 text-xs text-red-600">
              {{ getFieldError('code') }}
            </p>
          </div>

          <!-- Libellé -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Libellé <span *ngIf="isRequired('libelle')" class="text-red-500">*</span>
            </label>
            <input
              formControlName="libelle"
              type="text"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none"
              placeholder="Libellé de l'unité de mesure"
            />
            <p *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched"
               class="mt-1 text-xs text-red-600">
              {{ getFieldError('libelle') }}
            </p>
          </div>

          <!-- Symbole -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">Symbole</label>
            <input
              formControlName="symbole"
              type="text"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none"
              placeholder="Symbole (ex: %, kg, m)"
            />
            <p *ngIf="form.get('symbole')?.invalid && form.get('symbole')?.touched"
               class="mt-1 text-xs text-red-600">
              {{ getFieldError('symbole') }}
            </p>
          </div>

          <!-- Description -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">Description</label>
            <textarea
              formControlName="description"
              rows="3"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none"
              placeholder="Description de l'unité de mesure"
            ></textarea>
            <p *ngIf="form.get('description')?.invalid && form.get('description')?.touched"
               class="mt-1 text-xs text-red-600">
              {{ getFieldError('description') }}
            </p>
          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 pt-4">
            <button
              type="button"
              (click)="cancel()"
              class="rounded-lg border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
            >
              Annuler
            </button>
            <button
              type="submit"
              [disabled]="loading"
              class="rounded-lg bg-emerald-700 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-600 disabled:opacity-50"
            >
              {{ isEditMode ? 'Modifier' : 'Créer' }}
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</app-main-layout>
