<app-main-layout
  [menuItems]="menuItems"
  activeMenu="Plan de Mitigation"
  searchPlaceholder="Rechercher..."
  organizationName="Ministère de l'Économie et des Finances"
  userInitials="AD">

  <div class="p-6">
    <div class="max-w-4xl mx-auto space-y-6">

      <!-- En-tête -->
      <app-page-header subtitle="Gestion des risques" [title]="isEditMode ? 'Modifier le plan' : 'Nouveau plan de mitigation'">
        <svg icon xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <button
          actions
          (click)="cancel()"
          class="inline-flex items-center justify-center rounded-xl border border-white/30 bg-white/10 backdrop-blur-sm px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-white/20"
        >
          Retour
        </button>
      </app-page-header>

      <!-- Erreur globale -->
      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
        {{ error }}
      </div>

      <!-- Loader -->
      <div *ngIf="loading" class="rounded-3xl bg-white p-10 shadow-sm flex items-center justify-center">
        <span class="text-sm text-slate-500">Chargement des données...</span>
      </div>

      <!-- Formulaire -->
      <div *ngIf="!loading" class="rounded-3xl bg-white p-6 shadow-sm">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-slate-900">Informations générales</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

              <!-- ✅ Libellé -->
              <div class="md:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Libellé <span *ngIf="isRequired('libelle')" class="text-red-500">*</span></label>
                <input
                  formControlName="libelle"
                  type="text"
                  class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none"
                  placeholder="Libellé du plan de mitigation..."
                />
                <p *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched"
                   class="mt-1 text-xs text-red-600">
                  {{ getFieldError('libelle') }}
                </p>
              </div>

              <!-- Date de création -->
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Date de création <span *ngIf="isRequired('dateCreation')" class="text-red-500">*</span></label>
                <app-date-picker formControlName="dateCreation"></app-date-picker>
                <p *ngIf="form.get('dateCreation')?.invalid && form.get('dateCreation')?.touched"
                   class="mt-1 text-xs text-red-600">
                  {{ getFieldError('dateCreation') }}
                </p>
              </div>

              <!-- Risques -->
              <div class="md:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Risques associés <span *ngIf="isRequired('codesRisques')" class="text-red-500">*</span></label>
                <div class="flex gap-2">
                  <app-searchable-select [(ngModel)]="nouveauCodeRisque" [ngModelOptions]="{standalone: true}"
                    [options]="risqueOptions" placeholder="Rechercher un risque par code ou libellé..." class="flex-1"></app-searchable-select>
                  <button type="button" (click)="ajouterRisque()" [disabled]="!nouveauCodeRisque"
                    class="rounded-xl bg-emerald-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed">
                    Ajouter
                  </button>
                </div>
                <p *ngIf="form.get('codesRisques')?.invalid && form.get('codesRisques')?.touched"
                   class="mt-1 text-xs text-red-600">
                  {{ getFieldError('codesRisques') }}
                </p>

                <div *ngIf="risquesSelectionnes.length > 0" class="mt-3 space-y-2">
                  <div *ngFor="let risque of risquesSelectionnes"
                    class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="flex-shrink-0 inline-flex items-center rounded-full bg-emerald-100 text-emerald-700 px-2.5 py-0.5 text-xs font-semibold">
                        {{ risque.code }}
                      </span>
                      <span class="text-sm text-slate-700 truncate">{{ risque.libelle }}</span>
                    </div>
                    <button (click)="supprimerRisque(risque.code)" type="button"
                      class="flex-shrink-0 text-slate-400 hover:text-red-600 transition" title="Retirer ce risque">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

            </div>

            <!-- Description -->
            <div>
              <label class="mb-2 block text-sm font-semibold text-slate-700">Description</label>
              <textarea
                formControlName="description"
                rows="4"
                class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-400 focus:outline-none resize-none"
                placeholder="Description du plan de mitigation..."
              ></textarea>
              <p *ngIf="form.get('description')?.invalid && form.get('description')?.touched"
                 class="mt-1 text-xs text-red-600">
                {{ getFieldError('description') }}
              </p>
            </div>

          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 pt-4">
            <button
              type="button"
              (click)="cancel()"
              class="rounded-lg border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
            >
              Annuler
            </button>
            <button
              type="submit"
              [disabled]="loading"
              class="rounded-lg bg-emerald-700 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-600 disabled:opacity-50"
            >
              {{ isEditMode ? 'Modifier' : 'Créer' }}
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

</app-main-layout>
