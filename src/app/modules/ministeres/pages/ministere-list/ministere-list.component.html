<app-main-layout
  [menuItems]="menuItems"
  activeMenu="Structures"
  searchPlaceholder="Rechercher un ministère..."
  organizationName="Ministère de l'Économie et des Finances"
  userInitials="AD">

  <div class="p-4 md:p-6">
    <div class="max-w-[1600px] mx-auto space-y-6">

      <!-- En-tête -->
      <app-page-header subtitle="Administration" title="Ministères">
        <svg icon xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>
        </svg>
        <button
          actions
          (click)="createMinistere()"
          [disabled]="!isSuperAdmin"
          [title]="!isSuperAdmin ? 'Seul un super administrateur peut créer un ministère' : ''"
          class="inline-flex items-center justify-center rounded-xl px-4 py-2 text-sm font-semibold shadow-sm transition"
          [ngClass]="isSuperAdmin
            ? 'bg-emerald-600 text-white hover:bg-emerald-500'
            : 'bg-white/10 text-slate-400 cursor-not-allowed'"
        >
          Nouveau ministère
        </button>
      </app-page-header>

      <!-- Filtre dynamique -->
      <div *ngIf="!loading" class="rounded-2xl bg-white p-4 shadow-sm">
          <input
            [(ngModel)]="searchTerm"
            (ngModelChange)="applyFilter()"
            type="text"
            placeholder="Rechercher par code, nom, sigle..."
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm focus:border-emerald-400 focus:outline-none" />
        </div>

      <!-- Erreur -->
      <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">
        {{ error }}
      </div>

      <!-- Tableau -->
      <div class="rounded-3xl bg-white shadow-sm">
        <div class="overflow-x-auto">
        <table class="min-w-full table-auto border-collapse text-sm">
          <thead class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-left text-xs uppercase tracking-wide text-slate-200">
            <tr>
              <th class="px-4 py-3 whitespace-nowrap">Code</th>
              <th class="px-4 py-3 whitespace-nowrap">Nom</th>
              <th class="px-4 py-3 whitespace-nowrap hidden md:table-cell">Sigle</th>
              <th class="px-4 py-3 whitespace-nowrap text-right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let ministere of ministeres"
                class="border-t border-slate-200 hover:bg-slate-50">
              <td class="px-4 py-4 text-slate-700 whitespace-nowrap">{{ ministere.code }}</td>
              <td class="px-4 py-4 text-slate-700">{{ ministere.nom }}</td>
              <td class="px-4 py-4 text-slate-700 hidden md:table-cell">{{ ministere.sigle || '—' }}</td>
              <td class="px-4 py-4 text-right whitespace-nowrap">
                <div class="flex items-center justify-end gap-2">

                  <!-- Modifier -->
                  <button
                    (click)="editMinistere(ministere.id)"
                    [disabled]="!isSuperAdmin"
                    [title]="!isSuperAdmin ? 'Seul un super administrateur peut modifier un ministère' : 'Modifier'"
                    [attr.aria-label]="!isSuperAdmin ? 'Seul un super administrateur peut modifier un ministère' : 'Modifier'"
                    class="inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition"
                    [ngClass]="isSuperAdmin
                      ? 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      : 'bg-slate-100 text-slate-300 cursor-not-allowed'"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                  </button>

                  <!-- Supprimer -->
                  <button
                    (click)="deleteMinistere(ministere.id)"
                    [disabled]="!isSuperAdmin"
                    [title]="!isSuperAdmin ? 'Seul un super administrateur peut supprimer un ministère' : 'Supprimer'"
                    [attr.aria-label]="!isSuperAdmin ? 'Seul un super administrateur peut supprimer un ministère' : 'Supprimer'"
                    class="inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition"
                    [ngClass]="isSuperAdmin
                      ? 'bg-red-100 text-red-700 hover:bg-red-200'
                      : 'bg-red-50 text-red-200 cursor-not-allowed'"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="3 6 5 6 21 6"/>
                      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                      <path d="M10 11v6M14 11v6"/>
                      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    </svg>
                  </button>

                </div>
              </td>
            </tr>
            <tr *ngIf="!loading && ministeres.length === 0">
              <td colspan="5" class="px-4 py-8 text-center text-slate-500">
                Aucun ministère trouvé.
              </td>
            </tr>
          </tbody>
        </table>
        </div>

        <!-- Contrôles de pagination -->
        <app-pagination
          *ngIf="!loading"
          [currentPage]="currentPage"
          (currentPageChange)="goToPage($event)"
          [totalItems]="filteredMinisteres.length"
          [itemsPerPage]="itemsPerPage"
          (itemsPerPageChange)="onItemsPerPageChange($event)"
          itemLabel="ministères"
        ></app-pagination>
      </div>

      <!-- Chargement -->
      <div *ngIf="loading"
           class="rounded-3xl bg-white p-6 text-center text-sm text-slate-500 shadow-sm">
        Chargement des ministères...
      </div>

    </div>
  </div>

</app-main-layout>
